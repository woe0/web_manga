{% extends "base.html" %}
{% block title %}محادثة{% endblock %}
{% block content %}
  <h1>المحادثة</h1>
  <div class="messages">
    {% for message in messages %}
      <div class="message">
        <strong>{{ message.sender.username }}</strong>
        <p>{{ message.content }}</p>
      </div>
    {% endfor %}
  </div>
  <form method="post">
    {% csrf_token %}
    <textarea name="content" rows="2"></textarea>
    <button type="submit">إرسال</button>
  </form>
{% endblock %}
