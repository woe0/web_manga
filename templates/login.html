{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
  <div class="auth-card form-block">
    <h1>تسجيل الدخول</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <button type="submit" class="btn">دخول</button>
    </form>
    <p style="margin-top: 16px; color: var(--muted);">
      ليس لديك حساب؟ <a href="{% url 'register' %}">إنشاء حساب جديد</a>
    </p>
  </div>
{% endblock %}
